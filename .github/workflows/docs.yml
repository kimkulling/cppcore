name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Fetch doxygen-awesome-css theme
        run: |
          git clone --depth 1 --branch v2.3.4 \
            https://github.com/jothepro/doxygen-awesome-css.git \
            doxygen-awesome-css

      - name: Enable theme in Doxyfile
        run: |
          {
            echo ""
            echo "HTML_EXTRA_STYLESHEET  = doxygen-awesome-css/doxygen-awesome.css \\"
            echo "                         doxygen-awesome-css/doxygen-awesome-sidebar-only.css"
          } >> Doxyfile

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
